[project]
name = "pokerapp"
version = "0.1.0"
description = "bluh bluh"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pytest>=9.2.0",
]

[project.scripts]
pokerapp = "pokerapp.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
